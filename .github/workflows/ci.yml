name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      TEST_DB_DSN: "host=localhost user=postgres password=postgres dbname=postgres sslmode=disable"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Tidy (must be clean)
        run: |
          go mod tidy
          git diff --exit-code

      - name: gofmt (must be clean)
        run: |
          files="$(git ls-files '*.go')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      # Pinned rather than relying on the runner image: the player tests use
      # node:test mock.timers, which needs Node 20.4+.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: player JS tests
        run: node --test test/js/*.test.mjs

      - name: Coverage gate (enforced floor 68%)
        run: |
          COVERAGE_MIN=68 COVERAGE_ENFORCE=1 make coverage-check

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
